name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Checkout DisguiseAPI
        uses: actions/checkout@v5
        with:
          repository: itspinger/DisguiseAPI
          path: DisguiseAPI
          ref: PUT_TAG_OR_COMMIT_HERE   # <-- این خط را اضافه کنید

      - name: Build DisguiseAPI
        run: mvn -B install -DskipTests --file DisguiseAPI/pom.xml

      - name: Build Hynick
        run: mvn -B clean package --file Hynick/pom.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Hynick
          path: Hynick/target/*.jar
